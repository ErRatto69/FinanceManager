name: Build & Publish Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build & Push Backend (.NET 10)
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./FinanceApp.Api/Dockerfile
          push: true
          tags: ghcr.io/erratto69/financemanager-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Frontend (React + Vite + Nginx)
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./FinanceApp.Web
          file: ./FinanceApp.Web/Dockerfile
          push: true
          tags: ghcr.io/erratto69/financemanager-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max